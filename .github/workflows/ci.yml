name: CI - Java Spring Boot

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o JDK Java 21 conforme definido no pom.xml
      - name: Configurar o Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Dá permissão de execução ao Maven wrapper (caso utilize o ./mvnw)
      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw || true # O '|| true' evita erro caso o wrapper não exista no projeto

      # 4. Compila e executa os testes usando o Maven
      # Se você usa o maven wrapper, mude para ./mvnw clean test
      - name: Compilar e Rodar Testes
        run: mvn clean test